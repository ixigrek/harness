schemaVersion: "2"
kind: mixin
name: harness-dev
displayName: Harness (dev)
description: Network and environment for a Go/Bun/Python project. No credentials.

requires:
  agent: claude

# The base `claude` kit already allows the Anthropic hosts.
# Only what the toolchain needs to reach goes here.
permissions:
  network:
    allow:
      # Go
      - proxy.golang.org
      - sum.golang.org
      - pkg.go.dev
      # Bun / npm
      - registry.npmjs.org
      # Python
      - pypi.org
      - files.pythonhosted.org
      # Sources & docs
      - github.com
      - api.github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - go.dev
    deny:
      - telemetry.go.dev

environment:
  variables:
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    GOTOOLCHAIN: local
    GOFLAGS: -mod=mod
    GOTELEMETRY: "off"
    DO_NOT_TRACK: "1"
