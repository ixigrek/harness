schemaVersion: "2"
kind: mixin
name: harness-infra
displayName: Harness (infra)
description: Network and environment for k8s / IaC repos. Credentials added in step 3.

requires:
  agent: claude

permissions:
  network:
    allow:
      # Sources (charts, modules, providers)
      - github.com
      - api.github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - registry.terraform.io
      - releases.hashicorp.com
      - registry.opentofu.org
      # Docs, read-only
      - kubernetes.io
      - helm.sh
      - docs.cilium.io
      - argo-cd.readthedocs.io
      - fluxcd.io
      - developer.hashicorp.com
      - opentofu.org
      - docs.aws.amazon.com
      - learn.microsoft.com
      - cloud.google.com
      - docs.hetzner.cloud
      - www.scaleway.com
      - help.ovhcloud.com
      # -- Step 3: cloud APIs, uncomment provider by provider --
      # - api.hetzner.cloud
      # - api.scaleway.com
      # - eu.api.ovh.com
      # - management.azure.com
      # - login.microsoftonline.com
      # - "*.googleapis.com"
      # - "*.amazonaws.com"       # single-label wildcard: narrow down per region/service
      # - <your-k8s-api-server>:6443
      # - <your-argocd>
    deny:
      - checkpoint-api.hashicorp.com
      - telemetry.go.dev

# -- Step 3: credentials injected by the proxy (simple bearer/token) --
# credentials:
#   - service: hcloud-ro
#     description: Hetzner API token (Read)
#     apiKey:
#       name: HCLOUD_TOKEN
#       inject:
#         - domain: api.hetzner.cloud
#           scheme: bearer
#   - service: scw-ro
#     description: Scaleway secret key (ReadOnly policy)
#     apiKey:
#       name: SCW_SECRET_KEY
#       inject:
#         - domain: api.scaleway.com
#           header: X-Auth-Token
#           format: "%s"
#   - service: argocd-ro
#     apiKey:
#       name: ARGOCD_AUTH_TOKEN
#       inject:
#         - domain: <your-argocd>
#           scheme: bearer
# AWS (SigV4), gcloud and az (OAuth), OVH (signature): ephemeral tokens via -e at run time, not via the proxy.

environment:
  variables:
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    GOTOOLCHAIN: local
    GOTELEMETRY: "off"
    CHECKPOINT_DISABLE: "1"
    CLOUDSDK_CORE_DISABLE_USAGE_REPORTING: "true"
    CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK: "true"
    AZURE_CORE_COLLECT_TELEMETRY: "false"
    HCLOUD_CLI_TELEMETRY: "off"
    SCW_DISABLE_CHECK_VERSION: "true"
    DO_NOT_TRACK: "1"
