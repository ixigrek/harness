schemaVersion: "2"
kind: mixin
name: project
displayName: Harness (project)
description: Generated by `harness md` from .harness/project.env and tools/*/{hosts,env}. Do not edit; extra hosts go in .harness/hosts. Stacked on harness-base by `harness run`. Frozen at creation (--fresh to change).

requires:
  agent: claude

permissions:
  network:
    allow:
@@HOSTS@@
# -- Step 3: credentials injected by the proxy (simple bearer/token) --
# credentials:
#   - service: hcloud-ro
#     description: Hetzner API token (Read)
#     apiKey:
#       name: HCLOUD_TOKEN
#       inject:
#         - domain: api.hetzner.cloud
#           scheme: bearer
#   - service: scw-ro
#     description: Scaleway secret key (ReadOnly policy)
#     apiKey:
#       name: SCW_SECRET_KEY
#       inject:
#         - domain: api.scaleway.com
#           header: X-Auth-Token
#           format: "%s"
#   - service: argocd-ro
#     apiKey:
#       name: ARGOCD_AUTH_TOKEN
#       inject:
#         - domain: <your-argocd>
#           scheme: bearer
# AWS (SigV4), gcloud and az (OAuth), OVH (signature): ephemeral tokens via -e at run time, not via the proxy.
# Other environment variables live in data/agent/.env (re-read every session), not here.
@@ENV@@
